<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipo Perico Reportes</title>
<meta name="description" content="Control de rentabilidad de Pipo Perico Hot Sauce para Conmigo Brands LLC.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf6ea">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Alfa+Slab+One&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ea;
    --card:#ffffff;
    --ink:#16241b;
    --muted:#6b6f63;
    --line:#e7dfcc;
    --green:#1f4d33;
    --pos:#2f7d4f;
    --amz:#c97f00;
    --red:#d2372a;
    --sun:#f2a516;
    --cream:#f6e6c4;
    --display:"Alfa Slab One",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
  [hidden]{display:none!important}

  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:64px;width:auto}
  .brand small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .brand b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--green);line-height:1.1}
  .btn{font:600 12px var(--sans);border:1px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:5px 13px;cursor:pointer}
  .btn:hover{background:var(--green);color:var(--cream)}

  h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5.5vw,46px);line-height:1.05;color:var(--green);margin-bottom:8px}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:22px}
  .dot{width:8px;height:8px;border-radius:50%;background:#2e9b5a;display:inline-block;box-shadow:0 0 0 3px rgba(46,155,90,.18)}

  /* Acceso */
  .gate{max-width:420px;margin:48px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
  .gate h2{font-family:var(--display);font-weight:400;color:var(--green);font-size:24px;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .gate form{display:flex;gap:8px}
  .gate input{flex:1;min-width:0;font:500 15px var(--sans);padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fdfaf2}
  .gate input:focus{outline:2px solid var(--green);outline-offset:1px}
  .gate button{font:600 14px var(--sans);background:var(--green);color:var(--cream);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
  .gate .err{color:var(--red);font-size:13px;margin:12px 0 0}

  /* Pestañas */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;margin-bottom:22px;position:sticky;top:0;background:var(--paper);z-index:5}
  .tabs button{font:600 13px var(--sans);white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer}
  .tabs button.on{background:var(--green);border-color:var(--green);color:var(--cream)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kpi small{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .kpi b{display:block;font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi em{font-style:normal;font-size:12px;color:var(--muted)}
  .kpi.hero{background:var(--green);border-color:var(--green);color:var(--cream)}
  .kpi.hero small,.kpi.hero em{color:rgba(246,230,196,.8)}
  .period{color:var(--muted);font-size:13px;margin-bottom:24px}

  .charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
  .chart h3{font-size:14px;font-weight:600;margin-bottom:4px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .chart svg text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
  .chart .hit{fill:transparent}
  .chart .mk{transition:opacity .15s}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-105%);opacity:0;transition:opacity .1s;z-index:3}
  .tip b{display:block;font-weight:600;margin-bottom:2px}

  /* Tablas del archivo */
  .tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:8px 14px;border-bottom:1px solid #f1ecdf;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal;min-width:220px}
  thead th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:#fdfaf2;border-bottom:1px solid var(--line)}
  tr.grp td{background:var(--green);color:var(--cream);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px}
  tr.tot td{font-weight:700;background:#fff8e1}
  td.neg{color:var(--red)}
  td.txt{text-align:left;white-space:normal}
  td.muted{color:#b8b3a6}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#e6f2ea;color:#22603c}
  .chip.pend{background:#f3eee2;color:var(--muted)}
  .title-row{font-family:var(--display);color:var(--green);font-size:18px;margin:0 0 10px}
  .notes{background:var(--cream);border-radius:14px;padding:14px 18px;font-size:14px}
  .notes p{margin:4px 0}
  .notes b{color:var(--green)}

  .msg{background:#fde8e5;border:1px solid var(--red);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:20px}
  footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted);margin-top:24px}

  @media (max-width:760px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .charts{grid-template-columns:1fr}
    .brand img{height:52px}
    th:first-child,td:first-child{min-width:170px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <img src="logo.png" alt="Pipo Perico Hot Sauce">
      <div><small>Conmigo Brands LLC</small><b>Pipo Perico</b></div>
    </div>
    <button class="btn" id="logout" hidden>Salir</button>
  </header>

  <!-- Acceso con clave -->
  <div class="gate" id="gate">
    <h2>Control de rentabilidad</h2>
    <p>Escribe la clave para ver el reporte.</p>
    <form id="gate-form">
      <input id="pw" type="password" placeholder="Clave" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="err" id="gate-err" hidden></p>
  </div>

  <!-- Reporte -->
  <main id="app" hidden>
    <h1>Control de rentabilidad</h1>
    <div class="meta">
      <span class="dot"></span>
      <span id="status"></span>
      <button class="btn" id="reload">Actualizar</button>
    </div>
    <div class="msg" id="msg" hidden></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
    <footer>Datos en vivo del archivo de control en Google Drive. Se revisa solo cada 2 minutos. Preparado por KOS para Conmigo Brands LLC.</footer>
  </main>
</div>

<script>
/* ================== CONFIGURACIÓN ==================
   URL del Apps Script (termina en /exec). Ver README.md.
   El archivo de Drive sigue privado: el script lo lee y solo
   entrega los datos si la clave es correcta.
   Para probar sin editar: ?api=URL_DEL_SCRIPT                */
const CONFIG = {
  API_URL: "",
  REFRESH_MIN: 2
};
/* =================================================== */

const $ = s => document.querySelector(s);
const apiUrl = new URLSearchParams(location.search).get("api") || CONFIG.API_URL;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const isNum = v => typeof v === "number" && isFinite(v);
const blank = v => v === "" || v === null || v === undefined;
const money = (v, dec=2) => {
  if(!isNum(v)) return "-";
  const s = Math.abs(v).toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:dec,maximumFractionDigits:dec});
  return v < -0.004 ? `(${s})` : s;
};
const int = v => isNum(v) ? Math.round(v).toLocaleString("en-US") : "-";

let pw = "", data = null, tab = "Resumen", timer = null;
try { pw = sessionStorage.getItem("pp-k") || ""; } catch(e) {}

/* ---------- Carga ---------- */
async function fetchData(key){
  const url = apiUrl + (apiUrl.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(key) + "&_=" + Date.now();
  const res = await fetch(url);
  return res.json();
}

async function enter(key){
  $("#gate-err").hidden = true;
  if(!apiUrl) return gateError("La página todavía no está conectada al archivo.");
  try{
    const j = await fetchData(key);
    if(j.error === "unauthorized") return gateError("Clave incorrecta.");
    if(j.error) return gateError("No se pudo leer el archivo: " + j.error);
    pw = key; try{ sessionStorage.setItem("pp-k", key); }catch(e){}
    data = j; showApp();
  }catch(e){ console.error(e); gateError("No se pudo conectar. Intenta de nuevo."); }
}
function gateError(t){ const e=$("#gate-err"); e.textContent=t; e.hidden=false; }

async function refresh(){
  try{
    const j = await fetchData(pw);
    if(j.error) throw new Error(j.error);
    data = j; $("#msg").hidden = true; render();
  }catch(e){
    console.error(e);
    const m=$("#msg"); m.hidden=false; m.textContent="No se pudo actualizar. Se muestran los últimos datos cargados.";
  }
}

function showApp(){
  $("#gate").hidden = true; $("#app").hidden = false; $("#logout").hidden = false;
  render();
  clearInterval(timer); timer = setInterval(refresh, CONFIG.REFRESH_MIN*60*1000);
}

$("#gate-form").addEventListener("submit", e => { e.preventDefault(); enter($("#pw").value); });
$("#reload").addEventListener("click", refresh);
$("#logout").addEventListener("click", () => { try{ sessionStorage.removeItem("pp-k"); }catch(e){} location.reload(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && data) refresh(); });

/* ---------- Lectura del archivo ---------- */
const sheet = name => data.sheets.find(s => norm(s.name) === norm(name));
const isSection = r => !blank(r[0]) && r.slice(1).every(blank) && String(r[0]) === String(r[0]).toUpperCase() && /[A-Z]/.test(String(r[0]));
const isTotal = r => { const a=String(r[0]??""); return a === a.toUpperCase() && /[A-Z]/.test(a) && r.slice(1).some(isNum); };

/* Fila de encabezados de periodos (Junio 2026, Julio 2026, ..., Total) */
function periodHeader(rows){
  for(let i=0;i<Math.min(rows.length,6);i++){
    if(rows[i].slice(1).filter(v => /20\d\d|total/i.test(String(v))).length >= 2) return i;
  }
  return -1;
}
function monthCols(rows){
  const h = periodHeader(rows); if(h<0) return {h, cols:[], total:-1};
  const cols=[]; let total=-1;
  rows[h].forEach((v,i)=>{ if(i===0||blank(v)) return; if(/total/i.test(v)) total=i; else cols.push(i); });
  return {h, cols, total};
}
/* Busca una fila por etiqueta, opcionalmente dentro de una sección */
function findRow(rows, label, section){
  let inSec = !section;
  for(const r of rows){
    if(section && isSection(r)) inSec = norm(r[0]) === norm(section);
    if(inSec && norm(r[0]) === norm(label)) return r;
  }
  return null;
}

/* ---------- Vistas ---------- */
function render(){
  const upd = data.updated ? new Date(data.updated) : null;
  $("#status").textContent = (upd ? `Archivo modificado ${upd.toLocaleString("es-MX",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})} · ` : "") +
    `revisado ${new Date().toLocaleTimeString("es-MX",{hour:"numeric",minute:"2-digit"})}`;
  const names = data.sheets.map(s => s.name);
  if(!names.some(n => norm(n) === norm(tab))) tab = names[0];
  $("#tabs").innerHTML = names.map(n => `<button class="${norm(n)===norm(tab)?"on":""}" data-t="${esc(n)}">${esc(n)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  const s = sheet(tab), isSum = norm(tab) === "resumen";
  $("#view").innerHTML = isSum ? summaryView(s) : sheetView(s);
  if(isSum) drawCharts(s);
}

/* Resumen: KPIs + gráficas + la pestaña completa */
function summaryView(s){
  const rows = s.rows, shop = sheet("Shopify"), amz = sheet("Amazon");
  const {h, total} = monthCols(rows);
  const T = r => r && total>=0 && isNum(r[total]) ? r[total] : NaN;
  const T2 = (r, sh) => { if(!r || !sh) return NaN; const t = monthCols(sh.rows).total; return t>=0 && isNum(r[t]) ? r[t] : NaN; };
  const add = (a,b) => (isNum(a)?a:0) + (isNum(b)?b:0);

  const shopIng = findRow(rows,"Ingreso comercial","SHOPIFY");
  const amzIng = findRow(rows,"Ventas netas","AMAZON");
  const res = findRow(rows,"RESULTADO E-COMMERCE");
  const shopMkt = T2(shop && findRow(shop.rows,"MARKETING TOTAL"), shop);
  const amzMkt = T2(amz && findRow(amz.rows,"MARKETING AMAZON TOTAL"), amz);
  const shopU = T2(shop && findRow(shop.rows,"Total unidades"), shop);
  const amzU = T2(amz && findRow(amz.rows,"Total unidades vendidas"), amz);
  const resV = T(res);

  return `
    <div class="kpis">
      <div class="kpi"><small>Ingresos</small><b>${money(add(T(shopIng),T(amzIng)),0)}</b><em>Shopify ${money(T(shopIng),0)} · Amazon ${money(T(amzIng),0)}</em></div>
      <div class="kpi"><small>Marketing total</small><b>${money(add(shopMkt,amzMkt),0)}</b><em>Shopify ${money(shopMkt,0)} · Amazon ${money(amzMkt,0)}</em></div>
      <div class="kpi"><small>Unidades vendidas</small><b>${int(add(shopU,amzU))}</b><em>Shopify ${int(shopU)} · Amazon ${int(amzU)}</em></div>
      <div class="kpi hero"><small>Resultado e-commerce</small><b>${money(resV,0)}</b><em>${resV<0?"pérdida":"ganancia"} después de marketing</em></div>
    </div>
    <p class="period">Periodo: ${esc(h>=0&&total>=0 ? rows[h][total] : "")}. Shopify y Amazon después de todos los costos y el marketing.</p>
    <div class="charts">
      <div class="chart"><h3>Ingresos por mes</h3>
        <div class="legend"><span><i style="background:var(--pos)"></i>Shopify</span><span><i style="background:var(--amz)"></i>Amazon</span></div>
        <div id="c-ing"></div><div class="tip"></div></div>
      <div class="chart"><h3>Resultado e-commerce por mes</h3>
        <div class="legend"><span><i style="background:var(--pos)"></i>Ganancia</span><span><i style="background:var(--red)"></i>Pérdida</span></div>
        <div id="c-res"></div><div class="tip"></div></div>
    </div>
    ${sheetView(s)}`;
}

function drawCharts(s){
  const rows = s.rows, {h, cols} = monthCols(rows);
  const shopIng = findRow(rows,"Ingreso comercial","SHOPIFY");
  const amzIng = findRow(rows,"Ventas netas","AMAZON");
  const res = findRow(rows,"RESULTADO E-COMMERCE");
  // Solo meses con alguna cifra capturada
  const months = cols.filter(c => [shopIng,amzIng,res].some(r => r && isNum(r[c]) && r[c] !== 0));
  const short = l => String(l).replace(/\s*20\d\d/,"");
  const val = (r,c) => r && isNum(r[c]) ? r[c] : 0;
  barChart($("#c-ing"), months.map(c=>({label:short(rows[h][c]), full:rows[h][c], vals:[
    {v: val(shopIng,c), color:"var(--pos)", name:"Shopify"},
    {v: val(amzIng,c), color:"var(--amz)", name:"Amazon"}]})));
  barChart($("#c-res"), months.map(c=>{ const v = val(res,c); return {label:short(rows[h][c]), full:rows[h][c], vals:[
    {v, color: v<0?"var(--red)":"var(--pos)", name:"Resultado"}]}; }));
}

/* Barras agrupadas con línea de cero y tooltip */
function barChart(el, groups){
  if(!el) return;
  if(!groups.length){ el.innerHTML = `<p class="period">Sin datos todavía.</p>`; return; }
  const W=480,H=210,P={l:60,r:8,t:12,b:26};
  const all = groups.flatMap(g=>g.vals.map(x=>x.v));
  let max=Math.max(0,...all), min=Math.min(0,...all);
  // Escala con números redondos (250, 500, 1,000...)
  const raw=(max-min)/4||1, mag=Math.pow(10,Math.floor(Math.log10(raw))), tick=[1,2,2.5,5,10].map(m=>m*mag).find(t=>t>=raw);
  max=Math.ceil(max/tick)*tick; min=Math.floor(min/tick)*tick;
  const nTicks=Math.round((max-min)/tick);
  const iw=W-P.l-P.r, ih=H-P.t-P.b, step=iw/groups.length;
  const y = v => P.t + (max-v)/(max-min)*ih;
  let g="";
  for(let i=0;i<=nTicks;i++){ const v=min+tick*i, yy=y(v);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#efe9db"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end">${money(v,0)}</text>`; }
  g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(0)}" y2="${y(0)}" stroke="#9c978a"/>`;
  let marks="";
  groups.forEach((gr,i)=>{
    g+=`<text x="${P.l+step*i+step/2}" y="${H-8}" text-anchor="middle">${esc(gr.label)}</text>`;
    const n=gr.vals.length, bw=Math.min(34,step*.7/n), gap=2, gw=n*bw+(n-1)*gap, x0=P.l+step*i+(step-gw)/2;
    gr.vals.forEach((s,j)=>{
      const x=x0+j*(bw+gap), y0=y(0), y1=y(s.v), hh=Math.abs(y1-y0), r=Math.min(4,hh,bw/2);
      const d = s.v>=0
        ? `M${x},${y0}V${y1+r}q0,-${r} ${r},-${r}h${bw-2*r}q${r},0 ${r},${r}V${y0}Z`
        : `M${x},${y0}V${y1-r}q0,${r} ${r},${r}h${bw-2*r}q${r},0 ${r},-${r}V${y0}Z`;
      marks+=`<path class="mk" data-g="${i}" d="${d}" fill="${s.color}"/>`;
    });
  });
  const hits = groups.map((gr,i)=>`<rect class="hit" data-i="${i}" x="${P.l+step*i}" y="${P.t}" width="${step}" height="${ih}"/>`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${marks}${hits}</svg>`;
  const tip = el.parentElement.querySelector(".tip"), svg = el.querySelector("svg");
  svg.querySelectorAll(".hit").forEach(hr=>{
    hr.addEventListener("mouseenter",()=>{
      const i=+hr.dataset.i, gr=groups[i], b=svg.getBoundingClientRect(), sc=b.width/W, pb=el.parentElement.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(gr.full)}</b>` + gr.vals.map(x=>`${esc(x.name)}: ${money(x.v)}`).join("<br>");
      const top = Math.min(...gr.vals.map(x=>y(Math.max(0,x.v))));
      tip.style.left=(b.left-pb.left+(P.l+step*i+step/2)*sc)+"px";
      tip.style.top=(b.top-pb.top+top*sc)+"px"; tip.style.opacity=1;
      svg.querySelectorAll(".mk").forEach(m=>m.style.opacity = +m.dataset.g===i ? 1 : .35);
    });
    hr.addEventListener("mouseleave",()=>{ tip.style.opacity=0; svg.querySelectorAll(".mk").forEach(m=>m.style.opacity=1); });
  });
}

/* Cualquier pestaña del archivo, tal cual, con formato.
   Si agregan meses, filas o pestañas nuevas, aparecen solas. */
const MONTH = /^(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)/i;
function sheetView(s){
  if(!s || !s.rows.length) return `<p class="period">Esta pestaña está vacía.</p>`;
  const rows = s.rows, width = Math.max(...rows.map(r=>r.length));
  const pad = r => { const o=r.slice(); while(o.length<width) o.push(""); return o; };
  const ph = periodHeader(rows);
  let out = "", i = 0;

  // Título en la primera fila
  if(!blank(rows[0][0]) && rows[0].slice(1).every(blank)){ out += `<p class="title-row">${esc(rows[0][0])}</p>`; i = 1; }
  // Instrucciones largas en una sola celda
  while(i < rows.length && i !== ph && !blank(rows[i][0]) && rows[i].slice(1).every(blank) && String(rows[i][0]).length > 60){
    out += `<p class="period">${esc(rows[i][0])}</p>`; i++;
  }
  // Encabezado: fila de periodos, o la primera fila con varias celdas de texto
  let head = ph;
  if(head < 0){
    for(let k=i;k<rows.length;k++){ const f=rows[k].filter(v=>!blank(v)); if(f.length>=2 && f.every(v=>typeof v==="string")){ head=k; break; } }
  }
  const headRow = head>=0 ? pad(rows[head]) : [];
  const monthCol = headRow.map((v,c)=> c>0 && ph<0 && MONTH.test(String(v)));   // columnas de estatus por mes
  const moneyCol = headRow.map(v => /\$/.test(String(v)));                      // p.ej. "COGS unitario ($)"

  let section = "", body = "", notes = [];
  for(let k=i;k<rows.length;k++){
    if(k === head) continue;
    const r = pad(rows[k]);
    if(r.every(blank)) continue;
    if(isSection(r)){
      section = String(r[0]);
      if(/^notas/i.test(section)){ for(k=k+1;k<rows.length;k++){ if(!rows[k].every(blank)) notes.push(rows[k]); } break; }
      body += `<tr class="grp"><td colspan="${width}">${esc(section)}</td></tr>`; continue;
    }
    const label = String(r[0] ?? "");
    const hasStatus = r.some(v => /^(conciliado|pendiente)/i.test(String(v)));
    const units = !/cogs/i.test(label) && (/unidad/i.test(section) || /unidad|vendidos|bottles|packs$|^merch$/i.test(label));
    const cells = r.map((v,c)=>{
      if(c===0) return `<td>${esc(v)}</td>`;
      if(isNum(v)){
        if(ph<0 && !moneyCol[c]) return `<td>${esc(v)}</td>`;
        return `<td class="${v<-0.004?"neg":""}">${units ? int(v) : money(v)}</td>`;
      }
      if(blank(v)) return monthCol[c] && hasStatus ? `<td><span class="chip pend">Pendiente</span></td>` : `<td class="muted">${ph>=0?"-":""}</td>`;
      if(/^conciliado$/i.test(v)) return `<td><span class="chip">Conciliado</span></td>`;
      return `<td class="txt">${esc(v)}</td>`;
    }).join("");
    body += `<tr class="${isTotal(r)?"tot":""}">${cells}</tr>`;
  }
  const thead = head>=0 ? `<thead><tr>${headRow.map(v=>`<th>${esc(v)}</th>`).join("")}</tr></thead>` : "";
  out += `<div class="tbl"><table>${thead}<tbody>${body}</tbody></table></div>`;
  if(notes.length) out += `<div class="notes">${notes.map(n=>`<p><b>${esc(n[0])}</b> ${esc(n.slice(1).filter(v=>!blank(v)).join(" "))}</p>`).join("")}</div>`;
  return out;
}

if(pw && apiUrl) enter(pw);
